<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Archive</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/highlight.min.css">
</head>
<body>

<header class="topbar">
    <div class="app-title"><img src="img/logo.png" alt="Tech Archive" class="app-logo"></div>

    <div class="actions">
        <button id="btn-new" class="icon-btn" title="New Note" aria-label="New Note">+</button>
        <div class="menu-container">
            <button id="btn-menu" class="icon-btn" title="Menu" aria-label="Menu">&#9776;</button>
            <div id="dropdown-menu" class="dropdown-menu hidden">
                <button id="btn-import" class="dropdown-item">Import JSON</button>
                <button id="btn-export" class="dropdown-item">Export JSON</button>
            </div>
        </div>
    </div>
</header>

<main>
    <section id="sticky-section" class="sticky-section hidden" aria-label="Sticky Notes">
        <div class="sticky-section-header">
            <div class="sticky-section-title">
                <span class="sticky-title-icon">📌</span>
                <span>Sticky Notes</span>
                <span id="sticky-count-badge" class="sticky-count-badge">0</span>
            </div>
            <div id="sticky-pagination-info" class="sticky-pagination-info"></div>
        </div>
        <div class="sticky-slider-container">
            <button id="sticky-prev-btn" class="sticky-nav-btn sticky-prev" title="Previous sticky notes" aria-label="Previous sticky notes">&lt;</button>
            <div id="sticky-viewport" class="sticky-viewport">
                <div id="sticky-track" class="sticky-track"></div>
            </div>
            <button id="sticky-next-btn" class="sticky-nav-btn sticky-next" title="Next sticky notes" aria-label="Next sticky notes">&gt;</button>
        </div>
    </section>

    <input
        id="search-box"
        type="text"
        placeholder="Search... (Ctrl+F)"
        autofocus
    >

    <div id="results"></div>
</main>

<footer class="fixed-footer">
    <div id="status"></div>
    <div class="footer-author">Created by ForgottenOne</div>
</footer>


<div id="drawer" class="drawer">
    <div class="drawer-header">
        <div class="drawer-actions">
            <button id="btn-edit-note">Edit</button>
            <button id="btn-delete-note" class="btn-danger">Delete</button>
        </div>
        <div class="drawer-header-right">
            <button id="btn-sticky-note" class="btn-sticky" title="Toggle sticky status">📌 Sticky</button>
            <button id="drawer-close">Close</button>
        </div>
    </div>

    <div id="drawer-content"></div>
</div>


<div id="modal" class="modal hidden">

    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modal-title">New Note</h2>
            <button id="modal-close-x" class="modal-close-btn" title="Close">&times;</button>
        </div>

        <div class="modal-body">
            <label for="note-title">Title</label>
            <input id="note-title" type="text" placeholder="Note title...">

            <div class="modal-row">
                <div class="modal-col-tags">
                    <label>Tags</label>
                    <div id="tags-container" class="tags-container">
                        <div id="tag-chips" class="tag-chips-list"></div>
                        <input id="note-tags-input" type="text" placeholder="Add tag..." autocomplete="off">
                        <div id="tag-suggestions" class="suggestions-box hidden"></div>
                    </div>
                </div>

                <div class="modal-col-priority">
                    <label for="note-priority">Search Priority</label>
                    <select id="note-priority"></select>
                </div>
            </div>

            <label for="note-body">Content</label>
            <textarea id="note-body" placeholder="Write your note here..."></textarea>
        </div>

        <div class="modal-actions">
            <button id="note-save" class="btn-primary">Save</button>
            <button id="note-cancel">Cancel</button>
        </div>

    </div>

</div>


<input
    type="file"
    id="file-import"
    accept=".json"
    hidden
>


<script src="js/library/highlight.min.js"></script>
<script src="js/storage.js"></script>
<script src="js/config.js"></script>
<script src="js/highlight-lang.js"></script>
<script src="js/index.js"></script>
<script src="js/search.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
